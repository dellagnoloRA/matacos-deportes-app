services:
  # =========================================================================
  # 1. BASE DE DATOS: PostgreSQL 16 (Transacciones ACID y Bloqueo de Filas)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: matacos_postgres
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
      POSTGRES_USER: ${POSTGRES_USER:-matacos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matacos_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-matacos_db}
    ports:
      # Solo accesible en localhost del servidor (nunca expuesto a Internet)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d # Opcional: scripts SQL de inicio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matacos_admin} -d ${POSTGRES_DB:-matacos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - matacos_network

  # =========================================================================
  # 2. APLICACIÓN FULL-STACK: Next.js 15 (E-commerce + POS Mostrador + API)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-5493704287158}
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-Matacos Deportes}
        NEXT_PUBLIC_STORE_ADDRESS: ${NEXT_PUBLIC_STORE_ADDRESS:-Saavedra 241, Formosa, Argentina}
        NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY:-}
    container_name: matacos_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      TZ: America/Argentina/Buenos_Aires
      # Siempre apunta al servicio interno 'postgres' en la red Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-matacos_admin}:${POSTGRES_PASSWORD:-matacos_secure_password_2026}@postgres:5432/${POSTGRES_DB:-matacos_db}?schema=public
    ports:
      # Solo accesible en localhost (para cron jobs y diagnóstico local; Caddy gestiona 80/443)
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # Persiste fotos de productos, banners y comprobantes de transferencia entre rebuilds
      - uploads_data:/app/public/uploads
    networks:
      - matacos_network

  # =========================================================================
  # 3. PROXY INVERSO & SSL AUTOMÁTICO: Caddy Server (Producción VPS)
  # =========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: matacos_caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "80:80"   # HTTP (Redirección automática)
      - "443:443" # HTTPS (Certificado SSL automático Let's Encrypt)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads_data:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - matacos_network

# =========================================================================
# VOLÚMENES PERSISTENTES (Los datos y archivos subidos no se pierden al reiniciar)
# =========================================================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# =========================================================================
# RED INTERNA AISLADA
# =========================================================================
networks:
  matacos_network:
    driver: bridge
