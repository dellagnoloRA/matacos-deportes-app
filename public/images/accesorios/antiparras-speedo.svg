<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goggleFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="goggleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#goggleShadow)">
    <!-- Silicone Straps stretching to edges -->
    <path d="M40 142 C90 135 120 135 140 140" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 158 C90 165 120 165 140 160" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M260 140 C280 135 310 135 360 142" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M260 160 C280 165 310 165 360 158" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Eyepiece Outer Frame -->
    <ellipse cx="160" cy="150" rx="36" ry="26" fill="url(#goggleFrame)" transform="rotate(-5 160 150)"/>
    <!-- Left Lens -->
    <ellipse cx="160" cy="150" rx="28" ry="19" fill="url(#lensGrad)" transform="rotate(-5 160 150)"/>
    <!-- Left Lens Reflection Flare -->
    <path d="M145 140 Q160 135 175 142" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Eyepiece Outer Frame -->
    <ellipse cx="240" cy="150" rx="36" ry="26" fill="url(#goggleFrame)" transform="rotate(5 240 150)"/>
    <!-- Right Lens -->
    <ellipse cx="240" cy="150" rx="28" ry="19" fill="url(#lensGrad)" transform="rotate(5 240 150)"/>
    <!-- Right Lens Reflection Flare -->
    <path d="M225 142 Q240 135 255 140" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Flexible Nose Bridge -->
    <path d="M188 150 Q200 143 212 150" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M192 153 Q200 147 208 153" stroke="#0f172a" stroke-width="2"/>

    <!-- SPEEDO Badge -->
    <text x="200" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#0284c7" letter-spacing="2">SPEEDO</text>
  </g>
</svg>
