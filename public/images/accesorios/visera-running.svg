<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>
  <defs>
    <linearGradient id="viseraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D615"/>
      <stop offset="100%" stop-color="#00A811"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Visor Shadow & Shape -->
  <g filter="url(#shadow)">
    <!-- Headband Arc -->
    <path d="M110 135 C110 80, 290 80, 290 135 C275 145, 125 145, 110 135 Z" fill="#0f172a" opacity="0.9"/>
    
    <!-- Visor Crown / Front Band -->
    <path d="M120 130 C150 95, 250 95, 280 130 C250 145, 150 145, 120 130 Z" fill="url(#viseraGrad)"/>
    
    <!-- Curved Brim / Visor Peak -->
    <path d="M95 130 C120 185, 280 185, 305 130 C270 170, 130 170, 95 130 Z" fill="#1e293b"/>
    <path d="M95 130 C130 170, 270 170, 305 130 C280 180, 120 180, 95 130 Z" fill="url(#viseraGrad)"/>
    
    <!-- Neon Accent Stripe on Brim -->
    <path d="M125 155 C160 172, 240 172, 275 155 C240 168, 160 168, 125 155 Z" fill="url(#greenAccent)"/>
    
    <!-- Matacos Icon / Logo on Crown -->
    <polygon points="190,112 210,112 216,128 206,128 200,117 194,128 184,128" fill="#00D615"/>
  </g>
</svg>
