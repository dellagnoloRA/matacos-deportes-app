<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#6B3410"/>
      <stop offset="100%" stop-color="#4A2006"/>
    </linearGradient>
    <linearGradient id="buckleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="beltGlow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3e1a05" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#beltGlow)">
    <!-- Leather Belt Contour Curve (Wide lumbar in center, tapering to ends) -->
    <path d="M40 148 C100 135 150 120 200 120 C250 120 300 135 360 148 L355 162 C300 152 250 142 200 142 C150 142 100 152 45 162 Z" fill="url(#leatherGrad)"/>
    
    <!-- Fine stitching line along top and bottom -->
    <path d="M48 150 C105 137 152 124 200 124 C248 124 295 137 352 150" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <path d="M51 160 C105 150 152 139 200 139 C248 139 295 150 348 160" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>

    <!-- Dual Row Adjustment Holes on right -->
    <circle cx="280" cy="144" r="2.5" fill="#291203" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="295" cy="146" r="2.5" fill="#291203" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="310" cy="148" r="2.5" fill="#291203" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="325" cy="151" r="2.5" fill="#291203" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="340" cy="153" r="2.5" fill="#291203" stroke="#94a3b8" stroke-width="0.8"/>

    <!-- Steel Double-Prong Roller Buckle on left -->
    <rect x="52" y="137" width="22" height="28" rx="4" fill="none" stroke="url(#buckleGrad)" stroke-width="4.5"/>
    <line x1="58" y1="145" x2="70" y2="145" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58" y1="157" x2="70" y2="157" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="76" y="138" width="6" height="26" rx="2" fill="#475569"/>

    <!-- Embossed MATACOS PRO branding in center -->
    <text x="200" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#291203" letter-spacing="2">MATACOS PRO</text>
    <text x="200" y="133.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ca8a04" opacity="0.75" letter-spacing="2">MATACOS PRO</text>
  </g>
</svg>
